# ============================================================================
# hrcd-rekap : set-shared-password.yml — setel SATU password yang sama untuk
# semua akun panitia sekaligus.
#
# UNTUK APA, DAN KAPAN JANGAN
#
# Untuk pagi simulasi atau hari-H, supaya sepuluh orang bisa login tanpa
# sepuluh serah-terima password acak satu per satu. BUKAN untuk keadaan
# sehari-hari: selama password ini berlaku, `riwayat`, `diinput_oleh`, dan
# catatan siapa membuka gembok nilai tidak lagi menunjuk orang — semuanya
# menunjuk "siapa saja yang tahu passwordnya". Setelah simulasi, kembalikan
# tiap akun ke password acaknya lewat "Ganti password akun panitia".
#
# BEDANYA DARI "Ganti password akun panitia"
#
# Workflow itu SELALU mengacak dan tidak pernah menerima password ketikan,
# karena isi kotak "Run workflow" tersimpan permanen di riwayat GitHub. Di
# sini password memang diketik, dan itu disengaja: password bersama tidak
# punya kerahasiaan untuk dilindungi — ia akan ada di grup WA lima menit
# setelah dibuat. Aturan di sana melindungi password RAHASIA; ini bukan
# salah satunya.
#
# CARA PAKAI DARI HP:
#   1. Actions -> "Setel password bersama semua akun" -> Run workflow.
#   2. Isi "password" (minimal 8 huruf/angka) dan ketik SEMUA di kotak
#      konfirmasi. Run workflow.
#   3. Buka run-nya, lihat daftar akun yang berhasil diganti. Passwordnya
#      tidak dicetak di log — kamu sendiri yang mengetiknya.
#
# Butuh secret SUPABASE_URL dan SUPABASE_SERVICE_KEY, sama persis dengan
# change-password.yml dan provision-accounts.yml.
# ============================================================================

name: Setel password bersama semua akun

on:
  workflow_dispatch:
    inputs:
      password:
        description: >-
          Password bersama, minimal 8 huruf/angka. Diketik di sini dengan
          sengaja — lihat catatan di berkas workflow.
        required: true
        type: string
      konfirmasi:
        description: >-
          Ketik SEMUA (huruf besar) untuk memastikan. Ini mengganti password
          SETIAP akun panitia aktif sekaligus.
        required: true
        type: string
      termasuk_admin:
        description: >-
          Ikutkan akun admin. Bawaannya TIDAK, karena admin memegang layar
          Akun — password admin yang sama dengan password grup membuat matriks
          hak akses tidak menahan apa-apa.
        required: false
        default: false
        type: boolean

jobs:
  setel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Periksa konfirmasi
        # Dipisah jadi langkah sendiri supaya run yang salah tekan berhenti
        # SEBELUM menyentuh satu akun pun.
        env:
          KONFIRMASI: ${{ inputs.konfirmasi }}
        run: |
          if [ "$KONFIRMASI" != "SEMUA" ]; then
            echo "Konfirmasi harus persis SEMUA (huruf besar). Tidak ada yang diubah."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Setel password bersama
        # Lewat env var, BUKAN diselipkan langsung ke shell — interpolasi
        # ${{ }} ke dalam run: rawan shell injection dari input bebas. Catatan
        # yang sama ada di provision-accounts.yml dan change-password.yml.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PASSWORD: ${{ inputs.password }}
          TERMASUK_ADMIN: ${{ inputs.termasuk_admin }}
        run: |
          if [ "$TERMASUK_ADMIN" = "true" ]; then
            python scripts/set_shared_password.py "$PASSWORD" --termasuk-admin
          else
            python scripts/set_shared_password.py "$PASSWORD"
          fi
