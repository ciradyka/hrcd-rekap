# ============================================================================
# hrcd-rekap : publish-live.yml — tulis live.json + rekap.json lalu deploy.
#
# Halaman rekap peserta TIDAK membaca database. Workflow inilah yang membaca,
# menulis hasilnya jadi DUA berkas statis, lalu men-deploy folder live/ —
# yang sejak 14 Agustus 2026 juga memuat FORM PENDAFTARAN. Artinya workflow
# ini satu-satunya jalur deploy situs peserta, termasuk saat yang berubah
# hanya daftar.html.
#
# PROJECT `hrcd37` DI CLOUDFLARE TIDAK BOLEH TERSAMBUNG GIT. Kalau tersambung,
# tiap push ke main akan menimpa kedua berkas itu dengan contoh fase 'pra'
# yang ada di repo, dan rekap peserta mendadak kosong tanpa ada yang gagal.
# 1.500-3.000 HP peserta hanya menyentuh hosting statis Cloudflare — nol
# permintaan ke Supabase, dan halaman itu tidak perlu membawa kunci apa pun
# (docs/rancangan-b.md bagian 7).
#
# YANG MENJAGA KEJUTAN ADA DI DATABASE, BUKAN DI SINI.
# Selama status_acara.fase_live masih 'progres', v_klasemen_publik memang
# mengembalikan nol baris dan v_progres_publik tidak memuat satu pun angka
# nilai. Fase 'top10' hanya menerbitkan maksimal sepuluh regu eligible per
# golongan beserta totalnya; fase 'penuh' menerbitkan papan lengkap; fase
# 'juara' menutup papan sepenuhnya dan menerbitkan daftar juara beserta
# angkanya. Yang menahan angka itu sebelum diumumkan bukan ketiadaan
# kolomnya melainkan pagar fase: v_kejuaraan_publik mengembalikan nol baris
# di luar fase 'juara' (0163, kolom skornya kembali di 0164).
#
# CRON 15 MENIT AKTIF HANYA 29 AGUSTUS 2026, 06:00-18:59 WIB. Cron memakai
# UTC dan tidak punya kolom tahun, jadi jadwal memilih 01:00-16:45 UTC lalu
# langkah pertama memeriksa tahun/tanggal lengkap. Di luar jendela itu workflow
# berhenti sebelum membaca database atau deploy. Tombol Run workflow tetap bisa
# ditekan kapan pun, termasuk dari HP.
#
# Butuh repository secret (dua-duanya sudah dipakai workflow lain):
#   SUPABASE_DB_URL       connection string Postgres (Session pooler, 5432)
#   CLOUDFLARE_API_TOKEN  template "Edit Cloudflare Workers"
# ============================================================================

name: Publish rekap live

# AUTO DEPLOY, dan kenapa ini AMAN padahal Git integration Cloudflare tidak.
#
# Keduanya terdengar sama — "deploy tiap push" — tapi yang dilakukan berbeda
# di satu titik yang menentukan:
#
#   Git integration Cloudflare menyajikan folder live/ APA ADANYA dari repo,
#   termasuk live.json dan rekap.json yang tersimpan di sana sebagai contoh
#   fase 'pra'. Tiap push akan mengosongkan rekap peserta tanpa ada yang
#   gagal.
#
#   Workflow ini MENIMPA kedua berkas itu dari database lebih dulu, baru
#   men-deploy. Berkas contoh di repo tidak pernah sampai ke Cloudflare.
#
# Jadi larangan di atas tetap berlaku sepenuhnya: project hrcd37 tidak boleh
# tersambung Git. Yang ditambahkan di sini bukan jalur kedua, melainkan pemicu
# kedua untuk jalur yang sama.
#
# Kenapa perlu: situs peserta memuat FORM PENDAFTARAN dan rekap live, dan
# keduanya sempat tertinggal berjam-jam karena merge tidak menerbitkan apa
# pun — larangan angka pada nama sudah merge tapi pembina tetap bisa mengetik
# angka, karena berkasnya belum naik.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'live/**'
      # Query yang menghasilkan isi live.json. Mengubahnya mengubah apa yang
      # terbit, walau tidak satu berkas pun di live/ ikut berubah.
      - 'supabase/checks/live_json.sql'
      - '.github/workflows/publish-live.yml'
  schedule:
    # 06:00-18:59 WIB pada hari lomba, tiap 15 menit. Cron memakai UTC dan
    # 06:00 WIB jatuh pada 23:00 UTC hari sebelumnya, jadi dua baris. Cron
    # tidak mendukung tahun; langkah `jadwal` di bawah menolak tanggal lain.
    #
    # Jendelanya disamakan dengan refresh-live-score.yml dan diambil dari
    # pengukuran yang sama — penjelasan lengkapnya di sana. Ringkasnya:
    # penulisan nilai berlangsung 06:00-19:00 WIB dengan puncak 12:00-13:00,
    # sementara jendela lama jalan sampai tengah malam.
    #
    # 64 run jadi ~50.
    - cron: '*/15 23 28 8 *'
    - cron: '*/15 0-11 29 8 *'

# Dua jalan yang bertumpuk akan saling menimpa live.json di Cloudflare, dan
# yang menang belum tentu yang terbaru. Satu jalan saja pada satu waktu.
concurrency:
  group: publish-live
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    steps:
      - name: Periksa jendela penerbitan otomatis
        id: jadwal
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "aktif=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sekarang="$(date -u '+%Y-%m-%dT%H:%M')"
          # Dua jendela, sama dengan dua baris cron di atas: 23:00 UTC
          # 28 Agustus (= 06:00 WIB) dan 00:00-11:59 UTC 29 Agustus
          # (= 07:00-18:59 WIB).
          if [[ "$sekarang" =~ ^2026-08-28T23: ]] \
             || [[ "$sekarang" =~ ^2026-08-29T(0[0-9]|1[01]): ]]; then
            echo "aktif=true" >> "$GITHUB_OUTPUT"
          else
            echo "aktif=false" >> "$GITHUB_OUTPUT"
            echo "Di luar 29 Agustus 2026 08:00-23:59 WIB; tidak menerbitkan."
          fi

      - uses: actions/checkout@v4
        if: steps.jadwal.outputs.aktif == 'true'

      - name: Tulis live.json + rekap.json dari database
        if: steps.jadwal.outputs.aktif == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ]; then
            echo "Secret SUPABASE_DB_URL belum diisi."
            exit 1
          fi
          # -A -t: keluaran mentah tanpa bingkai tabel dan tanpa judul kolom,
          # sehingga yang tertulis ke berkas benar-benar JSON saja.
          psql "$DB_URL" -A -t -v ON_ERROR_STOP=1 \
            -f supabase/checks/live_json.sql > /tmp/rekap-utuh.json

          # Satu query, DUA berkas. Pemisahan inilah yang menahan 3.000 HP:
          # yang di-poll tiap menit cuma live.json yang ±1 KB, sedangkan
          # rekap.json yang puluhan KB dialamati `?v=<versi>` dan karena itu
          # boleh mengendap di cache browser dan cache tepi Cloudflare sampai
          # isinya benar-benar berubah.
          #
          # `versi` = sidik jari isi rekap, BUKAN jam penerbitan. Menjalankan
          # workflow ini sepuluh kali tanpa ada nilai baru menghasilkan versi
          # yang sama sepuluh kali — dan tidak satu HP pun mengunduh ulang.
          python3 - <<'PY'
          import json, hashlib, sys

          d = json.load(open('/tmp/rekap-utuh.json'))
          for k in ('dibuat_pada', 'fase', 'edisi', 'ringkas', 'pos',
                    'komponen', 'kelengkapan', 'progres', 'klasemen',
                    'kejuaraan'):
              if k not in d:
                  sys.exit(f'kunci {k} hilang dari keluaran live_json.sql')

          # Live Score peserta hanya untuk Eksternal. Database dan layar
          # panitia tetap menyimpan Intern PA/PI sebagai klasemen tersendiri;
          # barisnya dibuang di batas penerbitan supaya bukan sekadar tab yang
          # disembunyikan oleh JavaScript. Komponen khusus Intern juga tidak
          # perlu ikut memperbesar berkas publik.
          eksternal = lambda baris: not str(baris.get('golongan', '')).startswith('intern')
          d['progres'] = [baris for baris in d['progres'] if eksternal(baris)]
          d['klasemen'] = [baris for baris in d['klasemen'] if eksternal(baris)]
          d['komponen'] = [baris for baris in d['komponen'] if eksternal(baris)]

          # Top 10 bukan papan penuh yang kolomnya disembunyikan dengan CSS.
          # Berkas publiknya sendiri hanya membawa identitas, peringkat, dan
          # Total; poin per pos serta rincian penalti tidak ikut ke CDN.
          if d['fase'] == 'top10':
              kunci_top = ('peringkat', 'nomor_dada', 'nama_regu',
                           'nama_sekolah', 'golongan', 'total')
              d['klasemen'] = [
                  {k: baris.get(k) for k in kunci_top}
                  for baris in d['klasemen']
              ]

          # Pagar kebocoran, dijaga di sini SEKALIGUS di view (0005/0026).
          if d['fase'] not in ('penuh', 'top10') and d['klasemen']:
              sys.exit('BOCOR: klasemen ikut tertulis pada fase yang tertutup')
          # Daftar juara hanya pada fase 'juara' (0163). ITULAH pagarnya, dan
          # sejak 0164 ia satu-satunya: angkanya sekarang memang ikut terbit,
          # jadi tidak ada lapisan kedua di belakangnya. Sebelum juaranya
          # diumumkan, view-nya mengembalikan nol baris dan tidak ada yang
          # bisa dibaca siapa pun.
          if d['fase'] != 'juara' and d['kejuaraan']:
              sys.exit('BOCOR: kejuaraan tertulis padahal fase belum juara')
          # Kolomnya DIDAFTAR, bukan dilarang satu per satu. Pagar lama
          # menolak apa pun yang bertipe angka; itu tidak bisa dipertahankan
          # sesudah 0164 dan menggantinya dengan daftar-larangan akan buta
          # terhadap kolom baru bernama lain. Yang dipakai kebalikannya: kolom
          # yang TIDAK dikenal menghentikan penerbitan. `hasil_kejuaraan()`
          # duduk di atas `pendaftaran`, satu tabel dengan nomor WA pembina —
          # satu `select *` yang kelewat lebar di masa depan berhenti di sini,
          # bukan di HP peserta (CLAUDE.md 13.3).
          KOLOM_JUARA = {'urutan', 'kode', 'nama_penghargaan', 'nomor_dada',
                         'nama_regu', 'nama_sekolah', 'golongan',
                         'total', 'poin_juara', 'jumlah_skor'}
          for baris in d['kejuaraan']:
              asing = set(baris) - KOLOM_JUARA
              if asing:
                  sys.exit(f'BOCOR: kolom tak dikenal di daftar juara: {sorted(asing)}')
          # Fase juara menutup papan, dan itu bagian dari janjinya: yang
          # dilihat peserta di sana HANYA kejuaraan. Kedua view memang sudah
          # menutup sendiri; kalau suatu hari tidak lagi, berhenti di sini.
          if d['fase'] == 'juara' and (d['klasemen'] or d['progres']):
              sys.exit('BOCOR: papan ikut tertulis pada fase juara')
          if d['fase'] == 'top10':
              per_golongan = {}
              for baris in d['klasemen']:
                  if baris.get('peringkat') is None:
                      sys.exit('BOCOR: regu tanpa peringkat ikut Top 10')
                  golongan = baris.get('golongan')
                  per_golongan[golongan] = per_golongan.get(golongan, 0) + 1
              if any(jumlah > 10 for jumlah in per_golongan.values()):
                  sys.exit('BOCOR: Top 10 memuat lebih dari sepuluh regu per golongan')
          # Sebelum lomba dimulai peserta tidak boleh melihat rekap apa pun,
          # dan v_progres_publik memang mengembalikan nol baris di fase 'pra'.
          # Kalau suatu hari ia tidak lagi begitu, berhenti di sini.
          if d['fase'] == 'pra' and d['progres']:
              sys.exit('BOCOR: baris regu ikut tertulis padahal fase masih pra')
          if d['fase'] == 'pra' and d['kelengkapan']:
              sys.exit('BOCOR: kelengkapan pos tertulis padahal fase masih pra')
          # Nilai asli per komponen HANYA boleh ada di fase 'penuh'. Centang
          # (`komponen_terisi`) boleh sejak 'progres' — ia tidak menyebut satu
          # angka pun. Pemisahan itu satu-satunya jaminan bahwa nilai yang
          # belum diumumkan memang TIDAK ADA di CDN, bukan sekadar tidak
          # digambar.
          #
          # `poin` ikut dijaga, dan itu bukan kehati-hatian berlebihan: ia
          # DITURUNKAN dari nilai lewat hitung_poin(), jadi menerbitkannya
          # lebih awal membocorkan hasil lomba sama telanjangnya. Papan Live
          # Score sekarang menggambar poin, bukan angka mentah — kalau pagar
          # ini cuma menyebut `nilai`, yang bocor justru kolom yang dibaca
          # orang.
          if d['fase'] != 'penuh':
              for baris in d['progres']:
                  for kunci in ('nilai', 'poin'):
                      if baris.get(kunci):
                          sys.exit(f'BOCOR: {kunci} per komponen tertulis padahal fase belum penuh')

          rekap = {'progres': d['progres'], 'klasemen': d['klasemen'],
                   'kejuaraan': d['kejuaraan']}
          sidik = hashlib.sha256(json.dumps(
              rekap, sort_keys=True, separators=(',', ':'),
              default=str).encode('utf-8')).hexdigest()[:12]
          rekap['versi'] = sidik

          meta = {
              'dibuat_pada': d['dibuat_pada'],
              'versi':       sidik,
              'fase':        d['fase'],
              'edisi':       d['edisi'],
              'ringkas':     d['ringkas'],
              'pos':         d['pos'],
              # Kemajuan input per pos (0048). Ditaruh di live.json dan bukan
              # di rekap.json justru karena ia berubah terus: rekap.json
              # dialamati `?v=<versi>` dan sengaja mengendap di cache, jadi
              # angka yang harus selalu segar tidak boleh menumpang di sana.
              'komponen':    d['komponen'],
              'kelengkapan': d['kelengkapan'],
              'jumlah_regu': len(d['progres']),
          }

          # live.json diberi indentasi supaya bisa dibaca mata saat memeriksa;
          # rekap.json dipadatkan karena ia yang benar-benar menyeberangi
          # jaringan seluler ribuan kali.
          with open('live/live.json', 'w', encoding='utf-8') as f:
              json.dump(meta, f, ensure_ascii=False, indent=2, default=str)
              f.write('\n')
          with open('live/rekap.json', 'w', encoding='utf-8') as f:
              json.dump(rekap, f, ensure_ascii=False,
                        separators=(',', ':'), default=str)
              f.write('\n')

          import os
          print(f"fase={d['fase']} versi={sidik} regu={len(d['progres'])} "
                f"klasemen={len(d['klasemen'])} juara={len(d['kejuaraan'])} "
                f"pos={len(d['pos'])} "
                f"live.json={os.path.getsize('live/live.json')}B "
                f"rekap.json={os.path.getsize('live/rekap.json')}B")
          PY

      - uses: actions/setup-node@v4
        if: steps.jadwal.outputs.aktif == 'true'
        with:
          node-version: '20'

      - run: npm install -g wrangler
        if: steps.jadwal.outputs.aktif == 'true'

      - name: Deploy halaman rekap
        if: steps.jadwal.outputs.aktif == 'true'
        working-directory: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: wrangler deploy

      - name: Ringkasan
        if: steps.jadwal.outputs.aktif == 'true'
        run: echo "REKAP TERBIT — $(date -u '+%Y-%m-%d %H:%M UTC')"
