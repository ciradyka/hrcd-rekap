# ============================================================================
# hrcd-rekap : sql-tests.yml — jalankan seluruh tes SQL di PostgreSQL sungguhan.
#
# Kenapa ada: sampai sekarang tes hanya bisa dijalankan kalau maintainer
# kebetulan punya PostgreSQL lokal. Akibatnya migrasi bisa ter-merge tanpa
# pernah sekali pun dieksekusi Postgres — persis risiko terbesar di repo ini,
# karena yang paling gampang salah justru SQL-nya (fungsi, RLS, constraint),
# bukan tampilannya.
#
# Runner GitHub sudah punya psql, dan Postgres-nya dijalankan sebagai service
# container. Jadi setiap push dan setiap PR memverifikasi: seluruh migrasi
# 0001..00NN jalan berurutan dari database kosong, seed masuk, dan semua
# assert di tests/sql/ lolos.
#
# Port 55432 (bukan 5432) sengaja disamakan dengan tests/run.sh dan
# tests/dev_database.sh supaya perintahnya persis sama di CI maupun di laptop.
# ============================================================================

name: SQL Tests

# ---------------------------------------------------------------------------
# DIJALANKAN SAAT DIMINTA, TIDAK OTOMATIS.
#
# Tidak ada trigger `push` maupun `pull_request`. Seluruh isi berkas ini bisa
# dijalankan di laptop dengan satu perintah — `bash tests/run.sh` — dan itulah
# yang dituntut CLAUDE.md pasal 16.1 sebelum PR dibuka. Menjalankannya lagi di
# jam GitHub tidak menambah bukti apa pun, tetapi menambah tagihan: pemakaian
# dibulatkan ke atas per JOB ke menit penuh, jadi tiap run menagih satu menit
# penuh walau isinya lima puluh detik.
#
# Diukur sekali: dalam 20 jam, 24 dari 60 run adalah salinan kedua dari
# pemeriksaan yang sudah hijau — sekali di PR, sekali lagi saat merge-nya
# mendarat di `main`, atas pohon yang sama persis.
#
# KAPAN TETAP DIJALANKAN. Bukan "kalau sempat", melainkan saat salah itu mahal:
#
#   * ada migrasi baru — ia akan menyentuh database produksi
#   * perubahan yang tidak bisa dijalankan lokal (butuh secret repo)
#   * laptop yang dipakai tidak punya PostgreSQL, atau hasil lokalnya meragukan
#   * minggu menjelang hari lomba
#
#   gh workflow run "SQL Tests" --ref <cabang>
#
# Atau dari HP: Actions -> SQL Tests -> Run workflow -> pilih cabangnya.
#
# YANG HILANG, dan ini disengaja: tidak ada lagi apa pun di GitHub yang
# memeriksa satu cabang pun dengan sendirinya. Pasal 16 bukan anjuran lagi.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:

jobs:
  tes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hrcd
        ports:
          - 55432:5432
        # Job tidak boleh mulai sebelum Postgres benar-benar menerima koneksi.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Tunjukkan versi psql & server
        env:
          PGPASSWORD: hrcd
        run: |
          psql --version
          psql -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "select version();"

      - name: Test JavaScript
        run: node --test tests/*.test.mjs

      - name: Verify print preview extractor
        run: python tools/pratinjau_cetak.py > /dev/null

      - name: Jalankan seluruh tes
        env:
          PGPASSWORD: hrcd
        run: bash tests/run.sh

      - name: Pasang dependency uji konkurensi
        run: python -m pip install psycopg2-binary

      - name: Uji daftar ulang serentak
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGDATABASE: hrcd_test
          PGUSER: postgres
          PGPASSWORD: hrcd
        run: python tests/concurrency_test.py
