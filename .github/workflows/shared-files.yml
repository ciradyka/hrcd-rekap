# ============================================================================
# hrcd-rekap : shared-files.yml — pastikan salinan berkas bersama tidak
# menyimpang.
#
# KENAPA ADA SALINAN SAMA SEKALI
#
# Sejak 14 Agustus 2026 ada DUA situs statis dengan akar folder berbeda:
#
#   web/   -> panitia-hrcd37.ciradyka.workers.dev  (layar panitia)
#   live/  -> hrcd37.ciradyka.workers.dev          (pendaftaran + rekap live)
#
# Form pendaftaran tinggal di situs peserta, dan ia memakai berkas yang sama
# dengan layar panitia: api.js, util.js, style.css, config.js. Cloudflare
# static assets menyajikan SATU folder apa adanya — tidak ada cara satu berkas
# hidup di dua akar tanpa disalin, dan repo ini sengaja tanpa build step yang
# bisa menyalinnya saat deploy.
#
# Jadi salinannya dititipkan di git, dan workflow inilah yang membuatnya tidak
# bisa membusuk. Duplikasi yang diam adalah bug yang menunggu; duplikasi yang
# berteriak setiap kali menyimpang cuma sedikit berisik.
#
# Kalau workflow ini gagal: salin ulang dari web/ ke live/, jangan menyunting
# salinannya. web/ yang jadi acuan.
#
#   cp web/style.css live/style.css
#   cp web/config.js live/config.js
#   cp web/js/api.js web/js/util.js live/js/
# ============================================================================

name: Shared files

# Saat diminta saja — alasan lengkapnya di sql-tests.yml. Keempat pemeriksaan
# di bawah semuanya jalan di laptop dalam hitungan detik:
#
#   diff web/style.css live/style.css   (dan tiga pasangan lainnya)
#   python tools/periksa_impor.py
#   python tools/periksa_urutan_golongan.py
#   python tools/periksa_sekolah.py
#
# Jalankan keempatnya sebelum membuka PR. Yang dibayar di sini bukan lamanya —
# run tujuh detik pun ditagih satu menit penuh, sama dengan SQL Tests.
on:
  workflow_dispatch:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bandingkan salinan live/ dengan acuan di web/
        run: |
          set -euo pipefail
          gagal=0
          banding() {
            if ! diff -q "$1" "$2" >/dev/null 2>&1; then
              echo "MENYIMPANG: $2 tidak sama dengan $1"
              diff -u "$1" "$2" | head -40 || true
              gagal=1
            else
              echo "sama: $2"
            fi
          }
          banding web/style.css   live/style.css
          banding web/config.js   live/config.js
          banding web/js/api.js   live/js/api.js
          banding web/js/util.js  live/js/util.js

          # Kedua berkas punya preamble berbeda panjang, lalu isi aturan yang
          # wajib sama. Drift pasangan ini pernah menghilangkan 21 baris.
          if ! diff -q <(tail -n +5 CLAUDE.md) <(tail -n +7 AGENTS.md) >/dev/null; then
            echo "MENYIMPANG: isi AGENTS.md tidak sama dengan CLAUDE.md"
            diff -u <(tail -n +5 CLAUDE.md) <(tail -n +7 AGENTS.md) | head -40 || true
            gagal=1
          else
            echo "sama: isi CLAUDE.md dan AGENTS.md"
          fi

          if [ "$gagal" -ne 0 ]; then
            echo ""
            echo "Salin ulang dari web/ (acuan), jangan sunting salinannya:"
            echo "  cp web/style.css live/style.css"
            echo "  cp web/config.js live/config.js"
            echo "  cp web/js/api.js web/js/util.js live/js/"
            exit 1
          fi
          echo "Seluruh salinan sama dengan acuannya."

      # Nama yang dipakai tanpa diimpor tidak menggagalkan apa pun sampai baris
      # itu dijalankan: `node --check` lulus, halaman terbuka normal, dan
      # galatnya baru muncul saat petugas menekan tombolnya di lapangan.
      # `kunciNilaiPos` pernah lolos sampai produksi persis begitu.
      - name: Setiap fungsi shared module yang dipanggil benar-benar diimpor
        run: python tools/periksa_impor.py

      # Golongan kini tinggal di web/js/util.js — berkas yang sudah dibandingkan
      # di atas, jadi ia tidak bisa menyimpang antar situs. Yang masih perlu
      # mesin adalah mencegah salinan BARU lahir: dulu ada TIGA, dan yang
      # ketiga bernama URUTAN_GOLONGAN sehingga penjaga lamanya — yang mencari
      # `const URUT_GOLONGAN` — tidak pernah melihatnya. Salinan itu justru
      # yang dipakai layar Live Score.
      - name: Golongan hanya didefinisikan di berkas bersama
        run: python tools/periksa_urutan_golongan.py

      # sekolah_nama.json dan sekolah_alamat.json dirawat terpisah dan tidak
      # ada langkah yang memaksa keduanya cocok. Dua agen pernah mengisi baris
      # untuk satu sekolah yang sama, dan satu baris terisi lengkap untuk
      # sekolah yang tidak pernah ada di daftar peserta.
      - name: Daftar sekolah masih cocok dengan daftar alamatnya
        run: python tools/periksa_sekolah.py
