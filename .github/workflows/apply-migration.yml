# ============================================================================
# hrcd-rekap : apply-migration.yml — jalankan SATU berkas migrasi ke Supabase.
#
# SENGAJA manual (workflow_dispatch), TIDAK otomatis saat push/merge. Alasannya
# tegas: ini satu-satunya jalur otomatis yang menyentuh database produksi, dan
# migrasi yang keliru di sini merusak data yang tidak bisa dikembalikan lewat
# git revert. Merge yang salah tidak boleh diam-diam mengubah produksi.
#
# Berkas ini dulu menambahkan "harus selalu ada manusia yang menekan
# tombolnya". Itu TIDAK lagi berlaku sejak 14 Agustus 2026: pemilik repo
# memilih agar migrasi dijalankan langsung oleh asisten setelah PR-nya merge,
# karena perbaikan yang sudah merge tapi belum diterapkan berkali-kali terlihat
# seperti "masih rusak" padahal kodenya sudah benar. Yang tetap dipertahankan
# adalah sifat manual workflow-nya — ia tidak pernah ikut berjalan sendiri saat
# push, jadi selalu ada satu perintah sadar yang memicunya, bukan efek samping
# dari merge.
#
# CARA PAKAI (bisa dari HP):
#   1. Repo -> tab Actions -> "Apply migration to Supabase" -> Run workflow.
#   2. Isi "berkas" dengan path lengkap, misalnya:
#        supabase/migrations/0011_nomor_dada_manual.sql
#   3. Run workflow, lalu buka log-nya untuk memastikan "MIGRASI BERHASIL".
#
# Dari baris perintah:
#   gh workflow run "Apply migration to Supabase" --ref main \
#     -f berkas=supabase/migrations/0020_nomor_dada_tiga_digit.sql
#
# URUTAN YANG BENAR saat migrasi mengubah bentuk RPC (mis. 0011 mengganti
# daftar_ulang_batch jadi dua argumen): terapkan migrasi DULU, lalu segera
# merge PR kodenya. Di antara keduanya ada jeda singkat di mana layar yang
# memanggil RPC lama akan gagal — lakukan berurutan cepat, jangan ditinggal.
#
# Butuh secret SUPABASE_DB_URL: connection string Postgres (Session pooler,
# port 5432 — BUKAN Direct connection yang IPv6-only dan tak terjangkau
# runner GitHub, bukan pula transaction pooler 6543 yang menolak sebagian DDL).
# Khusus cleanup_data_uji.sql, SUPABASE_URL dan SUPABASE_SERVICE_KEY juga
# dipakai untuk menghapus file fisik di bucket Storage `lembar` lewat API.
# ============================================================================

name: Apply migration to Supabase

on:
  workflow_dispatch:
    inputs:
      berkas:
        description: >-
          Path berkas migrasi, mis. supabase/migrations/0011_nomor_dada_manual.sql
        required: true
        type: string

jobs:
  terapkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.berkas == 'supabase/checks/cleanup_data_uji.sql'
        with:
          python-version: '3.12'

      - name: Periksa berkasnya ada
        # Lewat env var, BUKAN interpolasi ${{ }} langsung ke shell — input
        # workflow_dispatch adalah teks bebas (lihat catatan sama di
        # provision-accounts.yml).
        env:
          BERKAS: ${{ inputs.berkas }}
        run: |
          if [ ! -f "$BERKAS" ]; then
            echo "Berkas tidak ditemukan: $BERKAS"
            echo "Migrasi yang tersedia:"
            ls -1 supabase/migrations/
            exit 1
          fi
          echo "Akan menerapkan: $BERKAS"
          echo "--- isi berkas ---"
          cat "$BERKAS"

      - name: Terapkan ke Supabase
        env:
          BERKAS: ${{ inputs.berkas }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Secret SUPABASE_DB_URL belum diisi."
            exit 1
          fi
          if [ "$BERKAS" = "supabase/checks/cleanup_data_uji.sql" ] && \
             { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; }; then
            echo "Cleanup foto butuh SUPABASE_URL dan SUPABASE_SERVICE_KEY."
            exit 1
          fi
          # --single-transaction: kalau ada satu statement yang gagal, SELURUH
          # berkas di-rollback. Tidak ada bentuk "migrasi setengah jadi".
          # ON_ERROR_STOP: psql berhenti di galat pertama, bukan lanjut diam-diam.
          psql "$DB_URL" \
            --single-transaction \
            -v ON_ERROR_STOP=1 \
            -f "$BERKAS"

          if [ "$BERKAS" = "supabase/checks/cleanup_data_uji.sql" ]; then
            # DUA bucket, bukan satu. `bukti` menyimpan bukti transfer yang
            # diunggah pembina (migrasi 0121); barisnya di `pendaftaran` sudah
            # terhapus oleh SQL di atas, jadi gambarnya tinggal yatim — dan
            # bukti pembayaran percobaan tidak boleh ikut ke hari-H.
            for EMBER in lembar bukti; do
              DAFTAR="$RUNNER_TEMP/$EMBER-objects.json"
              psql "$DB_URL" -A -t -v ON_ERROR_STOP=1 \
                -c "select coalesce(json_agg(name order by name), '[]'::json) from storage.objects where bucket_id = '$EMBER'" \
                > "$DAFTAR"

              python scripts/delete_storage_objects.py "$EMBER" "$DAFTAR"

              SISA=$(psql "$DB_URL" -A -t -v ON_ERROR_STOP=1 \
                -c "select count(*) from storage.objects where bucket_id = '$EMBER'")
              if [ "$SISA" != "0" ]; then
                echo "Cleanup belum tuntas: masih ada $SISA objek di bucket $EMBER."
                exit 1
              fi
              echo "BUCKET BERSIH: $EMBER"
            done
          fi
          echo "MIGRASI BERHASIL: $BERKAS"
