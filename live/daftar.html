<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran — Hiking Rally Ciradyka</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="header">
    <!-- Angka romawi edisinya ditambahkan daftar.js dari data, bukan ditulis
         di sini — supaya tahun depan tidak ada yang lupa menggantinya. -->
    <span class="title" id="judul-daftar">Pendaftaran</span>
    <span class="spacer"></span>
    <span class="user-info" id="label-edisi"></span>
  </header>

  <main class="isi" id="layar" aria-live="polite">
    <!-- Cincin yang sama dengan pemuat() di js/util.js. Ditulis tangan di
         sini karena ini isi SEBELUM JavaScript jalan — dan justru di halaman
         inilah ia paling terasa: pendaftar membukanya dari jaringan
         seluler, sekali, tanpa apa pun tersimpan di cache. -->
    <div class="pemuat" role="status">
      <span class="pemuat-cincin" aria-hidden="true"></span>
      <span class="visually-hidden">Memuat…</span>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/daftar.js?v=3"></script>
</body>
</html>
