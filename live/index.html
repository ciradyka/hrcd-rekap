<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Score — Hiking Rally Ciradyka</title>
  <meta name="description" content="Rekap live Hiking Rally Ciradyka — periksa nilai regu sudah masuk atau belum.">
  <!-- Halaman ini TIDAK memuat kunci apa pun: tidak ada anon key, tidak ada
       alamat Supabase, tidak ada kotak login. Seluruh isinya datang dari dua
       berkas statis yang ditulis GitHub Actions — live.json (kecil, di-poll)
       dan rekap.json (besar, diambil sekali per versi). Itu sebabnya ia
       berdiri di Worker sendiri, terpisah dari layar panitia — lihat
       live/wrangler.toml dan kepala live.js. -->
  <!-- SATU SUMBER TAMPILAN untuk dua situs. style.css inilah yang dipakai layar
       panitia, dan berkas ini disalin byte-identik ke live/ serta ditegakkan
       shared-files.yml — jadi komponen yang sama tampil sama di kedua papan
       tanpa ada yang perlu menyalin aturan dengan tangan.

       Sebelumnya live.css memuat SALINANNYA SENDIRI atas 37 selektor yang sama
       (cincin, podium, juara, kemajuan, saringan organisasi), dan salinan itu
       sudah tertinggal: kartu Status di halaman ini tidak pernah mendapat gaya
       tombolnya karena aturannya cuma ada di style.css.

       live.css tinggal sesudahnya, dan isinya hanya yang memang milik halaman
       peserta: kepala hijau, kartu, tabel klasemen, dan dua override yang
       disengaja. Urutannya penting — yang belakangan menang. -->
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="live.css?v=2">
</head>
<body>
  <header class="kepala">
    <div class="kepala-isi">
      <h1 id="judul">Live Score</h1>
      <p class="sinkron" id="sinkron">Memuat…</p>
    </div>
  </header>

  <main id="isi">
    <p class="memuat">Memuat rekap…</p>
  </main>

  <footer class="kaki">
    <p>Hiking Rally Ciradyka · Ambalan Ciung Wanara – Dyah Pitaloka,
       SMA Negeri 1 Ciamis</p>
  </footer>

  <!-- Versinya DINAIKKAN tiap kali live.js berubah. Cache-Control-nya
       memang `no-cache` (selalu divalidasi), tapi itu tidak menolong
       halaman yang SUDAH TERBUKA: ia menjalankan kode yang dimuat waktu
       dibuka sampai di-reload. Menaikkan versinya membuat HP yang
       memuat ulang pasti mendapat berkas baru, bukan yang tersimpan. -->
  <!-- config.js DULU, dan ia memang belum pernah ada di sini. Tanpanya
       `window.HRCD` kosong, `ambilFaseDb()` pulang di baris pertamanya, dan
       saklar fase di layar panitia TIDAK berlaku seketika di halaman ini —
       ia baru terasa setelah penerbitan berikutnya. CLAUDE.md 14.3 menjanjikan
       sebaliknya, dan janji itu yang dipakai kalau nilai harus disembunyikan
       mendadak. Skrip biasa, bukan modul: ia cuma menaruh satu objek global.
  -->
  <script src="config.js"></script>
  <script type="module" src="live.js?v=12"></script>
</body>
</html>
