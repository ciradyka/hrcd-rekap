# ============================================================================
# hrcd-rekap : web/wrangler.toml — Workers static assets untuk situs statis
# (layar panitia + form pendaftaran publik).
#
# Cloudflare Pages berstatus "maintenance mode" (docs/desain-sistem.md 8.2) —
# ini jalur yang aktif dikembangkan Cloudflare untuk kebutuhan yang sama:
# terhubung Git, deploy otomatis tiap push ke main, tanpa build step.
#
# PENTING saat menyambungkan repo ini di dashboard Cloudflare:
#   Root directory: web
# Folder ini SENDIRI jadi akar proyek untuk koneksi Git tersebut — terpisah
# total dari workers/gateway/wrangler.toml (Worker gateway punya deploy-nya
# sendiri lewat GitHub Actions, tidak saling menyentuh dengan file ini).
#
# `name` SENGAJA memuat nomor edisi, dan sejak 14 Agustus 2026 berawalan
# `panitia-`. Alamat pendek yang gampang diingat diberikan kepada yang
# jumlahnya RATUSAN, bukan yang jumlahnya belasan:
#
#   hrcd37.ciradyka.workers.dev          -> peserta (pendaftaran + rekap live)
#   panitia-hrcd37.ciradyka.workers.dev  -> layar panitia (folder ini)
#
# Peserta tidak pernah menerima alamat yang ada kotak loginnya, dan link yang
# beredar di grup WhatsApp tidak sekaligus menyebarkan pintu masuk panitia.
# Tiap edisi ganti nama + URL (panitia-hrcd37 -> panitia-hrcd38 -> ...).
#
# CATATAN (2026-08-12): mengubah `name` di sini TIDAK cukup untuk merename
# project yang sudah tersambung Git — harus lewat dashboard (Settings ->
# rename, atau hapus+sambung ulang). Baru berhasil setelah rename manual di
# dashboard. Kalau `name` di sini dan URL yang sungguhan live tidak cocok,
# lihat riwayat commit file ini — jangan ubah salah satu tanpa menyamakan
# ALLOWED_ORIGIN di workers/gateway/worker.js juga.
# ============================================================================

name = "panitia-hrcd37"
compatibility_date = "2026-08-12"

[assets]
directory = "."
